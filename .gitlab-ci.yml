Deploy:Dev:
  extends: .deploy
  variables: &devVars
    ENDPOINT: "http://dev.${CI_DEPLOYMENT_DOMAIN}"
  environment:
    name: development
    url: "dev.${CI_DEPLOYMENT_DOMAIN}"
  rules:
    # We show dry-run only for MRs  to `develop`
    - if: '$CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
    # We deploy dev env from develop branch only
    - if: '$CI_COMMIT_BRANCH == "develop"'

Deploy:Staging:
  extends: .deploy
  variables: &stgVars
    ENDPOINT: "http://staging.${CI_DEPLOYMENT_DOMAIN}"
  environment:
    name: staging
    url: "staging.${CI_DEPLOYMENT_DOMAIN}"
  rules:
    # We show dry-run only for MRs to `main` from `develop`
    - if: '$CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop"'
    # We deploy staging env from main branch only
    - if: '$CI_COMMIT_BRANCH == "main"'

Deploy:Production:
  extends: .deploy
  variables: &prodVars
    ENDPOINT: "http://${CI_DEPLOYMENT_DOMAIN}"
    ALLOWED_USERS_LIST: >
      root - Alexander Popov
  before_script:
    - (echo ${ALLOWED_USERS_LIST} | grep ${GITLAB_USER_LOGIN}) && echo "Users is allowed to proceed" || (echo "No permissions"; exit 1)
  environment:
    name: production
    url: "${CI_DEPLOYMENT_DOMAIN}"
  rules:
    # We deploy prod env from tags only
    - if: '$CI_COMMIT_TAG'
      when: manual


Validate:Smoke:
  stage: validate
  script: echo "e2e tests"
  rules:
    # We run smoke tests after deployments
    - if: '$CI_COMMIT_BRANCH =~ /^main|develop$/'

Validate:E2E:
  stage: validate
  script: echo "e2e tests"
  rules:
    # We run e2e tests for main branch only
    - if: '$CI_COMMIT_BRANCH == "main"'

Release:Tag:
  stage: release
  script: echo "release"
  rules:
    # We run release creation from main branch only
    - if: '$CI_COMMIT_BRANCH == "main"'
